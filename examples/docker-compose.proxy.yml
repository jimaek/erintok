version: '3'
services:
  erin:
    image: mosswill/erin:latest
    networks:
      - global
    expose:
      - 80
    volumes:
      - ./videos:/srv/videos:ro
    environment:
      AUTH_SECRET: "<YOUR-HASH>"

      VIRTUAL_HOST: "your-domain.tld"
      VIRTUAL_PORT: "80"

      # Depending on your setup, you may also need
      # CERT_NAME: "default"
      # Or even
      # LETSENCRYPT_HOST: "your-domain.tld"
      #
      # Erin itself only speaks plain HTTP on port 80: the proxy takes care of HTTPS.

  proxy:
    image: jwilder/nginx-proxy
    networks:
      - global
    ports:
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro

networks:
  # Assumption made : network "global" is created beforehand
  # with            : docker network create global
  global:
    external: true
